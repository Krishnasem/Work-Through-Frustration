<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Outer circle with dashed border -->
  <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="2.5 2.5" />

  <g fill="#1665b1">
    <!-- Baseline -->
    <rect x="25" y="69" width="50" height="3.5" rx="1.75" />

    <!-- 4 Bars of Increasing Height -->
    <rect x="28" y="58" width="8" height="11" rx="2" />
    <rect x="40" y="50" width="8" height="19" rx="2" />
    <rect x="52" y="42" width="8" height="27" rx="2" />
    <rect x="64" y="34" width="8" height="35" rx="2" />

    <!-- Upward Trend Arrow -->
    <path d="M 25 54 C 38 48 54 37 70 26" stroke="#1665b1" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Arrowhead -->
    <path d="M 61 24 L 74 23 L 73 36 Z" fill="#1665b1" />
  </g>
</svg>
