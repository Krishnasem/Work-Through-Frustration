<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Outer circle with dashed border -->
  <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="2.5 2.5" />
  
  <!-- Teacher figure -->
  <circle cx="32" cy="31" r="5" fill="#1665b1" />
  <!-- Teacher body & arm with pointer -->
  <path d="M 26 40 C 26 38 38 38 38 40 L 38 54 C 38 56 35 57 32 57 C 29 57 26 56 26 54 Z" fill="#1665b1" />
  <!-- Arm pointing stick at board -->
  <path d="M 33 41 C 36 41 42 39 49 37 L 65 31" stroke="#1665b1" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Presentation / Blackboard -->
  <rect x="43" y="26" width="31" height="24" rx="2.5" fill="#1665b1" />
  <!-- Pointer on board (white line) -->
  <path d="M 44 42 L 67 31" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- 3 Students sitting in front -->
  <!-- Student 1 -->
  <circle cx="35" cy="59" r="4" fill="#1665b1" />
  <path d="M 29 73 C 29 65 41 65 41 73 Z" fill="#1665b1" />

  <!-- Student 2 -->
  <circle cx="51" cy="59" r="4" fill="#1665b1" />
  <path d="M 45 73 C 45 65 57 65 57 73 Z" fill="#1665b1" />

  <!-- Student 3 -->
  <circle cx="67" cy="59" r="4" fill="#1665b1" />
  <path d="M 61 73 C 61 65 73 65 73 73 Z" fill="#1665b1" />
</svg>
