<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" width="260" height="80" fill="none">
  <!-- Definitions for text along arc -->
  <defs>
    <!-- Left arc for "WORK THROUGH" -->
    <path id="arc-left" d="M 12 40 A 28 28 0 0 1 40 12" />
    <path id="arc-left-full" d="M 16 56 A 29 29 0 0 1 36 12" />
    <!-- Right arc for "FRUSTRATION" -->
    <path id="arc-right" d="M 40 12 A 28 28 0 0 1 68 40" />
    <path id="arc-right-full" d="M 44 12 A 29 29 0 0 1 64 56" />
    
    <!-- Circular text paths -->
    <path id="text-arc-left" d="M 16 58 C 10 44 14 26 32 15" fill="none" />
    <path id="text-arc-right" d="M 48 15 C 66 26 70 44 64 58" fill="none" />
  </defs>

  <!-- Left Emblem -->
  <g transform="translate(0, 0)">
    <!-- Outer tan/beige circle border -->
    <circle cx="40" cy="40" r="37" fill="#ffffff" stroke="#dacbb2" stroke-width="2.5" />
    <circle cx="40" cy="40" r="34.5" fill="#ffffff" stroke="#f4ebe1" stroke-width="1" />

    <!-- Circular Badge Text: WORK THROUGH (left) FRUSTRATION (right) -->
    <path id="leftArc" d="M 13 46 A 28 28 0 0 1 37 13" fill="none" />
    <path id="rightArc" d="M 43 13 A 28 28 0 0 1 67 46" fill="none" />

    <text font-family="system-ui, -apple-system, 'Arial Black', sans-serif" font-size="6.8" font-weight="900" fill="#1863a8" letter-spacing="0.5">
      <textPath href="#leftArc" startOffset="50%" text-anchor="middle">WORK THROUGH</textPath>
    </text>

    <text font-family="system-ui, -apple-system, 'Arial Black', sans-serif" font-size="6.8" font-weight="900" fill="#1863a8" letter-spacing="0.5">
      <textPath href="#rightArc" startOffset="50%" text-anchor="middle">FRUSTRATION</textPath>
    </text>

    <!-- Center Screaming Head & Frustration Marks in Orange -->
    <g transform="translate(18, 16)">
      <!-- Agitation rays/vibrations -->
      <path d="M 3 14 L 0 12 M 2 20 L -1 21 M 3 27 L 0 29 M 41 14 L 44 12 M 42 20 L 45 21 M 41 27 L 44 29" stroke="#e75615" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 6 8 L 3 5 M 38 8 L 41 5 M 12 3 L 10 0 M 32 3 L 34 0" stroke="#e75615" stroke-width="1.8" stroke-linecap="round" />

      <!-- Head Base Silhouette -->
      <path d="M 14 11 C 15 6 22 4 28 4 C 33 4 38 7 38 12 C 39 17 38 22 37 25 C 38 31 39 37 36 41 C 34 44 32 45 30 46 L 27 47 L 24 47 C 22 47 18 45 16 42 C 14 38 15 31 16 25 C 14 21 13 16 14 11 Z" fill="#e75615" />
      
      <!-- Ears & Neck -->
      <path d="M 14 24 C 11 25 11 29 13 32 L 15 32" fill="#e75615" />
      <path d="M 38 24 C 41 25 41 29 39 32 L 37 32" fill="#e75615" />
      <path d="M 18 43 L 18 48 L 34 48 L 34 43 Z" fill="#e75615" />

      <!-- Frustration & Stress Lines on Forehead / Brow (White) -->
      <path d="M 19 12 Q 26 10 33 12" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" fill="none" />
      <path d="M 21 15 Q 26 13 31 15" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none" />
      <!-- Furrowed vertical lines between eyes -->
      <path d="M 24 16 L 24 19 M 28 16 L 28 19" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none" />

      <!-- Squeezed shut Eyes (angled downwards stress lines) -->
      <path d="M 17 20 Q 21 18 24 21" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M 28 21 Q 31 18 35 20" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
      <path d="M 17 22 Q 20 20 23 23" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none" />
      <path d="M 29 23 Q 32 20 35 22" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none" />

      <!-- Screaming Open Mouth (Cavity) -->
      <path d="M 20 28 C 20 26 32 26 32 28 C 34 32 34 39 31 41 C 28 43 24 43 21 41 C 18 39 18 32 20 28 Z" fill="#ffffff" />
      <!-- Tongue / Throat inner silhouette -->
      <path d="M 22 34 C 23 30 29 30 30 34 C 31 38 29 40 26 40 C 23 40 21 38 22 34 Z" fill="#e75615" />
      <!-- Teeth highlight at top of mouth -->
      <path d="M 22 28 Q 26 29 30 28" stroke="#e75615" stroke-width="1.2" fill="none" />
    </g>
  </g>

  <!-- Right Text: WTF and Work Through Frustrations -->
  <g transform="translate(92, 0)">
    <!-- Big Bold WTF Letters -->
    <text x="0" y="50" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="52" fill="#1763aa" letter-spacing="-0.5">
      WTF
    </text>

    <!-- Subtitle: Work Through Frustrations -->
    <text x="1" y="68" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12.5" fill="#1763aa" letter-spacing="-0.2">
      Work Through Frustrations
    </text>
  </g>
</svg>
