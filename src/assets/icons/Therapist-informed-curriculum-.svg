<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Outer circle with dashed border -->
  <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="2.5 2.5" />

  <g fill="#1665b1">
    <!-- Left Person Head -->
    <circle cx="36" cy="31" r="5" />
    
    <!-- Right Person Head -->
    <circle cx="64" cy="31" r="5" />

    <!-- Left Person Body -->
    <path d="M 32 40 C 32 37.5 40 37.5 40 40 L 40 51 C 40 52 38 53 35 53 C 32 53 32 52 32 51 Z" />
    <!-- Left Person Arm extended to desk -->
    <path d="M 35 44 C 37 44 43 47 48 48.5 L 48 51 C 43 50 37 47 34 45 Z" />

    <!-- Right Person Body -->
    <path d="M 60 40 C 60 37.5 68 37.5 68 40 L 68 51 C 68 52 65 53 62 53 C 60 53 60 52 60 51 Z" />
    <!-- Right Person Arm extended to desk -->
    <path d="M 65 44 C 63 44 57 47 52 48.5 L 52 51 C 57 50 63 47 66 45 Z" />

    <!-- Desk / Table Top -->
    <rect x="35" y="50" width="30" height="4" rx="1.5" />
    
    <!-- Desk Legs / Frame -->
    <rect x="39" y="54" width="22" height="7" rx="1" />
  </g>

  <!-- Chair outlines and desk legs -->
  <g stroke="#1665b1" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Chair -->
    <path d="M 28 47 C 28 44 30 43 32 44 M 28 47 L 28 57 C 28 59 30 61 33 61 L 40 61" fill="none" />
    <path d="M 29 58 L 29 70 M 39 61 L 39 70" fill="none" />

    <!-- Right Chair -->
    <path d="M 72 47 C 72 44 70 43 68 44 M 72 47 L 72 57 C 72 59 70 61 67 61 L 60 61" fill="none" />
    <path d="M 71 58 L 71 70 M 61 61 L 61 70" fill="none" />

    <!-- Desk Legs to floor -->
    <path d="M 41 61 L 41 70 M 59 61 L 59 70" fill="none" />
  </g>
</svg>
