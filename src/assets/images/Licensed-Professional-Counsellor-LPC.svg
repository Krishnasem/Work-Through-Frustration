<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Outer circle with dashed border -->
  <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="2.5 2.5" />

  <!-- Ribbon tails (behind the medal) -->
  <g fill="#145d9e">
    <!-- Left Ribbon tail with V-notch -->
    <path d="M 43 54 L 30 71 L 38 68 L 41 76 L 49 57 Z" />
    <!-- Right Ribbon tail with V-notch -->
    <path d="M 57 54 L 70 71 L 62 68 L 59 76 L 51 57 Z" />
  </g>

  <!-- Medal Rosette Round Body -->
  <circle cx="50" cy="44" r="18" fill="#145d9e" />

  <!-- 5-Pointed Star in center of medal in white -->
  <polygon
    points="50,30 53.6,39.5 63.8,39.8 55.8,45.9 58.7,55.5 50,49.8 41.3,55.5 44.2,45.9 36.2,39.8 46.4,39.5"
    fill="#ffffff"
  />
</svg>
