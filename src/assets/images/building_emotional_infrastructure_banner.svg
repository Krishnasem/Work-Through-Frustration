<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 280" width="1400" height="280">
  <defs>
    <!-- Card gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#def6fa" />
      <stop offset="50%" stop-color="#e5f8fb" />
      <stop offset="100%" stop-color="#e2f7fa" />
    </linearGradient>

    <!-- Subtle inner border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bcecf4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#caeff6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Left flower/clover petal path -->
    <g id="flower-petal">
      <path d="M 0 0 C -22 -14 -32 -38 -20 -58 C -8 -78 20 -74 25 -52 C 28 -38 18 -16 0 0 Z" />
    </g>
  </defs>

  <!-- Banner Card Background with rounded corners and border -->
  <rect 
    x="6" 
    y="6" 
    width="1388" 
    height="268" 
    rx="44" 
    ry="44" 
    fill="url(#bgGradient)" 
    stroke="url(#borderGrad)" 
    stroke-width="2.5" 
  />

  <!-- Left Watermark: 4-petal flower in soft mint green -->
  <g transform="translate(145, 140)" fill="#78ce9d" fill-opacity="0.38">
    <!-- 4 organic rounded petals rotated 90 degrees -->
    <path d="M 0 0 C -26 -16 -36 -46 -22 -68 C -8 -88 22 -82 28 -58 C 32 -42 20 -18 0 0 Z" />
    <path d="M 0 0 C 16 -26 46 -36 68 -22 C 88 -8 82 22 58 28 C 42 32 18 20 0 0 Z" />
    <path d="M 0 0 C 26 16 36 46 22 68 C 8 88 -22 82 -28 58 C -32 42 -20 18 0 0 Z" />
    <path d="M 0 0 C -16 26 -46 36 -68 22 C -88 8 -82 -22 -58 -28 C -42 -32 -18 -20 0 0 Z" />
    <!-- Center disc -->
    <circle cx="0" cy="0" r="14" fill="#78ce9d" fill-opacity="0.5" />
  </g>

  <!-- Right Watermark: 4-petal flower in soft sky blue / cyan -->
  <g transform="translate(1255, 140)" fill="#4dbce9" fill-opacity="0.38">
    <path d="M 0 0 C -26 -16 -36 -46 -22 -68 C -8 -88 22 -82 28 -58 C 32 -42 20 -18 0 0 Z" />
    <path d="M 0 0 C 16 -26 46 -36 68 -22 C 88 -8 82 22 58 28 C 42 32 18 20 0 0 Z" />
    <path d="M 0 0 C 26 16 36 46 22 68 C 8 88 -22 82 -28 58 C -32 42 -20 18 0 0 Z" />
    <path d="M 0 0 C -16 26 -46 36 -68 22 C -88 8 -82 -22 -58 -28 C -42 -32 -18 -20 0 0 Z" />
    <circle cx="0" cy="0" r="14" fill="#4dbce9" fill-opacity="0.5" />
  </g>

  <!-- Central Title Text -->
  <text 
    x="700" 
    y="155" 
    text-anchor="middle" 
    fill="#145d9e" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="52" 
    font-weight="700" 
    letter-spacing="-0.5px">
    Building Emotional Infrastructure for Education
  </text>
</svg>
