<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Outer circle with dashed border -->
  <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="2.5 2.5" />

  <g fill="#145d9e">
    <!-- Radiating Rays above the head -->
    <!-- Ray 1 (leftmost) -->
    <line x1="26" y1="36" x2="29.5" y2="38" stroke="#145d9e" stroke-width="2.6" stroke-linecap="round" />
    <!-- Ray 2 -->
    <line x1="33" y1="28" x2="36" y2="31.5" stroke="#145d9e" stroke-width="2.6" stroke-linecap="round" />
    <!-- Ray 3 -->
    <line x1="43" y1="23" x2="45" y2="27.5" stroke="#145d9e" stroke-width="2.6" stroke-linecap="round" />
    <!-- Ray 4 (top) -->
    <line x1="53" y1="22" x2="53" y2="26.5" stroke="#145d9e" stroke-width="2.6" stroke-linecap="round" />
    <!-- Ray 5 -->
    <line x1="63" y1="24" x2="61" y2="28.5" stroke="#145d9e" stroke-width="2.6" stroke-linecap="round" />
    <!-- Ray 6 -->
    <line x1="71" y1="31" x2="68" y2="34.5" stroke="#145d9e" stroke-width="2.6" stroke-linecap="round" />

    <!-- Head Profile Facing Right -->
    <path d="M 40 74 L 40 68 C 34 65 30 58 30 49 C 30 38 39 30 50 30 C 58 30 65 35 67 42 L 70 45 C 71 46 70.5 48 68.5 48.5 L 68.5 50.5 C 70.5 51 70.5 53 69 53.5 L 67 54 C 66.5 57 64 59.5 61 60 L 59 64 L 59 74 Z" />
  </g>

  <!-- Brain in white inside the cranium -->
  <g fill="#ffffff">
    <!-- Brain lobe convolutions -->
    <path d="M 42 41 C 40 41 38 43 38 45.5 C 38 47.5 39 49 41 49.5 C 40.5 50.5 41 52 42.5 52.5 C 44 53 46 52 47 51 C 48 53 50.5 53.5 52 52 C 53.5 50.5 53 48.5 52 47.5 C 54 47 55 45 54 43 C 53 41 51 40 48.5 41 C 47.5 39.5 45.5 39 43.5 40 C 42.5 40.5 42.2 40.8 42 41 Z" />
  </g>

  <!-- Brain internal fold lines in blue -->
  <g stroke="#145d9e" stroke-width="1.2" stroke-linecap="round">
    <path d="M 44 44 C 45 46 47 45 49 46" fill="none" />
    <path d="M 43 48 C 45 49 48 48 50 49" fill="none" />
    <path d="M 46 42 C 48 43 49 41 51 43" fill="none" />
  </g>
</svg>
