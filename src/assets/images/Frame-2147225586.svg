<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Outer circle with dashed border -->
  <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#000000" stroke-width="1.2" stroke-dasharray="2.5 2.5" />

  <!-- Blue Group -->
  <g fill="#145d9e">
    <!-- Heart above hand -->
    <path d="M 54 28 C 48 24 37 26 34 35 C 31 43 45 53 54 58 C 63 53 77 43 74 35 C 71 26 60 24 54 28 Z" />
    
    <!-- Hand holding/supporting the heart from bottom-left -->
    <!-- Sleeve / cuff -->
    <rect x="23" y="53" width="7" height="17" rx="3" transform="rotate(-30 23 53)" />
    <!-- Palm and fingers cupping -->
    <path d="M 28 64 L 35 52 C 36 50 39 49 42 51 L 44 52 C 45 53 45.5 55 44.5 56.5 L 42 60 L 58 60 C 61 60 63 61.5 63 64 C 63 66.5 61 68 58 68 L 36 68 C 33 68 30 66 28 64 Z" />
    <!-- Extended finger under heart -->
    <path d="M 42 60 L 68 60 C 72 60 74 62.5 74 64.5 C 74 66.5 71.5 68 67 68 L 42 68 Z" />
  </g>

  <!-- People figures inside the heart (cutout in white) -->
  <g fill="#ffffff">
    <!-- Left adult head -->
    <circle cx="45" cy="38" r="4" />
    <!-- Left adult body -->
    <path d="M 40 47 C 40 43 50 43 50 47 Z" />

    <!-- Right adult head -->
    <circle cx="63" cy="38" r="4" />
    <!-- Right adult body -->
    <path d="M 58 47 C 58 43 68 43 68 47 Z" />

    <!-- Center child dot / head -->
    <circle cx="54" cy="46" r="2.8" />
    <!-- Center child body -->
    <path d="M 50.5 52 C 50.5 49 57.5 49 57.5 52 Z" />
  </g>
</svg>
